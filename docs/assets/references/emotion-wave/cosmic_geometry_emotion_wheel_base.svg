<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <title>Cosmic Geometry Emotion Wheel Base</title>
  <desc>Editable SVG base with eight emotion sectors and three radial levels. Japanese labels intentionally omitted for later editing in Inkscape.</desc>

  <defs>
    <radialGradient id="backgroundGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#14233a" stop-opacity="0.68"/>
      <stop offset="52%" stop-color="#090d18" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="1"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="ringLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#9ed7ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

