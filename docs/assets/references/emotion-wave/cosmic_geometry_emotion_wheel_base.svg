    <circle cx="600" cy="600" r="505" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
  </g>
  <g id="halo" filter="url(#strongGlow)" opacity="0.28">
    <circle cx="600" cy="600" r="430" fill="none" stroke="#6bbcff" stroke-width="18"/>
  </g>
