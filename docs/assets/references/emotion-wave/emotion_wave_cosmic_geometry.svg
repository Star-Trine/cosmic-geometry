<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="1400" height="1400" viewBox="0 0 1400 1400">

  <title>Emotion Wave — Cosmic Geometry</title>
  <desc>Eight primary emotions as basic waves, with secondary emotions positioned halfway between adjacent primary emotions.</desc>

  <defs>
    <filter id="glow-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="center-fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A0F1A" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#0A0F1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Background" id="layer-background">
    <rect x="0" y="0" width="1400" height="1400" fill="none"/>
    <circle cx="700" cy="700" r="620" fill="url(#center-fade)"/>
  </g>
