    <line x1="874.12" y1="279.63" x2="914.30" y2="182.63" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="1120.37" y1="525.88" x2="1217.37" y2="485.70" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="1120.37" y1="874.12" x2="1217.37" y2="914.30" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="874.12" y1="1120.37" x2="914.30" y2="1217.37" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="525.88" y1="1120.37" x2="485.70" y2="1217.37" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="279.63" y1="874.12" x2="182.63" y2="914.30" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="279.63" y1="525.88" x2="182.63" y2="485.70" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <line x1="525.88" y1="279.63" x2="485.70" y2="182.63" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
  </g>
