            font-size="27" fill="#F4E7B0">一次感情（基本波）</text>
      <text x="62" y="50"
            font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"
            font-size="19" fill="#E8DFC5" fill-opacity="0.82">感情を構成する8つの基本波</text>
